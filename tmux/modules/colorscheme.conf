# Enable the Gruvbox theme in dark mode
set -g @tmux-gruvbox 'dark'

# Make the status bar background transparent (uses terminal background)
set -g @tmux-gruvbox-statusbar-alpha 'true'

# Set the right status date format (DD.MM.YYYY)
set -g @tmux-gruvbox-right-status-x '%d.%m.%Y'

# Set the right status time format (12-hour clock with AM/PM)
set -g @tmux-gruvbox-right-status-y '%I:%M %p'
