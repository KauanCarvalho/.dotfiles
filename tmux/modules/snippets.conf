# Snippet picker: fuzzy search via fzf in a popup with auto-paste [prefix + p]

# Path to the helper script
set -g @snippet_picker "$HOME/.dotfiles/bin/snippet-fzf.sh"

# Keybinding 'prefix + p'
bind-key p run-shell ' \
    script_path="#{E:@snippet_picker}"; \
    if [ ! -x "$script_path" ]; then \
        tmux display-message "Error: Script not found or not executable at $script_path"; \
    elif ! command -v fzf >/dev/null 2>&1; then \
        tmux display-message "Error: fzf is not installed in PATH"; \
    else \
        tmux display-popup -w 80% -h 60% -E "bash -i -c \"$script_path\""; \
    fi \
'
